<style>
  :root {
    --blue: #0563ff;
    --yellow: #ffc502;
    --yellow-hover: #ffd21f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--blue);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Faixa do topo: o banner fica centralizado e os lados continuam
     no mesmo azul e com a mesma faixa amarela do banner. */
  .hero {
    background:
      linear-gradient(to bottom, transparent 91.42%, var(--yellow) 91.42%),
      linear-gradient(90deg, #005eff 50%, #0067ff 50%);
  }
  .hero img {
    display: block;
    width: 100%;
    max-width: 1320px;
    height: auto;
    margin: 0 auto;
  }
  /* Em telas mais largas que o banner, a borda direita some suave
     no azul em vez de cortar o texto vertical e a camiseta de uma vez. */
  @media (min-width: 1321px) {
    .hero img {
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 6%, #000 91%, transparent 100%);
      mask-image: linear-gradient(to right, transparent 0, #000 6%, #000 91%, transparent 100%);
    }
  }

  .profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 24px 64px;
    text-align: center;
  }

  .logo {
    position: relative;
    z-index: 1;
    display: block;
    width: 210px;
    height: 210px;
    /* sobe sobre o banner sem encostar no texto em telas pequenas */
    margin-top: calc(-1 * min(96px, 25vw - 8px));
  }

  h1 {
    margin-top: 26px;
    font-family: "Montserrat", Arial, Helvetica, sans-serif;
    font-weight: 700;
    font-size: 36px;
    line-height: 1.1;
    letter-spacing: .02em;
  }

  .handle {
    margin-top: 10px;
    font-size: 20px;
    font-weight: 700;
  }

  /* Coluna dos botões: mesmo tamanho no celular e no computador */
  .links {
    display: flex;
    flex-direction: column;
    gap: 17px;
    width: min(286px, 100%);
    margin-top: 34px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 55px;
    border-radius: 999px;
    background: var(--yellow);
    color: #000;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    text-decoration: none;
    transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease;
    animation: rise .5s ease both;
    animation-delay: calc(var(--i) * 70ms + 80ms);
  }
  .btn svg { flex: none; width: 15px; height: 15px; }

  .btn:hover {
    background: var(--yellow-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 20, 90, .35);
  }
  .btn:active { transform: scale(.98); box-shadow: none; }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  /* Computador: banner grande, logo um pouco maior, botões iguais */
  @media (min-width: 900px) {
    .logo { width: 240px; height: 240px; margin-top: -110px; }
    h1 { margin-top: 30px; font-size: 40px; }
    .links { margin-top: 38px; }
    .profile { padding-bottom: 88px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { animation: none; transition: none; }
  }
</style>
</head>
